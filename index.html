<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cantinho">
<meta name="theme-color" content="#14110f">
<meta name="app-version" content="12">
<title>Nosso Cantinho</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2314110f'/><text x='50' y='68' font-size='56' text-anchor='middle'>🍿</text></svg>">
<link rel="apple-touch-icon" id="touchIcon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14110f; --bg2:#1d1916; --card:#241f1b; --line:#342d27;
  --ink:#f4ece4; --mute:#a89a8c; --dim:#6f6358;
  --accent:#ff7a59; --star:#ffc857;
  --r:16px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px}
body{min-height:100vh;padding:calc(var(--st) + 8px) calc(var(--sr) + 16px) calc(var(--sb) + 100px) calc(var(--sl) + 16px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none;font-size:16px}
input[type=date]{min-height:46px;-webkit-appearance:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:76px}
.wrap{max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding:12px 0 4px}
#bell{position:relative;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:19px;align-items:center;justify-content:center;flex:none}
#bell i,.nb{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--accent);color:#170d08;font-size:11px;font-weight:700;font-style:normal;align-items:center;justify-content:center;display:none}
nav button{position:relative}
.nb{top:0;right:12px}
.row.news{padding:10px}
.row.news .cover{width:52px}
.row.news.fresh{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.newtag{position:absolute;top:6px;right:6px;font-size:9px;font-weight:800;padding:3px 6px;border-radius:99px;background:var(--accent);color:#170d08;letter-spacing:.4px;z-index:2}
header .av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--accent);display:none}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:28px;margin:0;letter-spacing:-.5px;line-height:1.05;flex:1}
h1 small{display:block;font-family:Inter,sans-serif;font-size:12px;font-weight:500;color:var(--mute);letter-spacing:.4px;text-transform:uppercase;margin-bottom:3px}
.status{font-size:13px;color:var(--mute);padding:10px 12px;background:var(--bg2);border-radius:12px;margin:10px 0;display:none}
.status.show{display:block}
.seg{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.seg::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--mute);font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{display:flex;gap:8px;margin:8px 0 4px}
.toolbar input{flex:1}
.toolbar .btn{width:auto;padding:0 16px;font-size:14px}
.stats{display:flex;gap:16px;color:var(--mute);font-size:13px;margin:6px 0 12px}
.stats b{color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
.poster{position:relative;text-align:left;display:block}
.cover{aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--card);position:relative;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:flex;align-items:flex-end;padding:10px;font-family:Fraunces,serif;font-weight:700;font-size:15px;line-height:1.15;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.poster .t{font-size:13px;font-weight:600;margin-top:6px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.poster .s{font-size:12px;color:var(--star);margin-top:2px}
.badge{position:absolute;top:6px;left:6px;font-size:10px;font-weight:600;padding:3px 7px;border-radius:99px;background:rgba(0,0,0,.65);color:#fff;letter-spacing:.3px;z-index:1}
.list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.row{display:flex;gap:12px;background:var(--card);border-radius:var(--r);padding:12px;text-align:left;width:100%;border:1px solid var(--line)}
.row .cover{width:72px;flex:none;border-radius:8px}
.row.place .cover{aspect-ratio:1/1}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row .title{font-weight:600;font-size:16px}
.meta{font-size:12px;color:var(--mute)}
.row .note{font-size:13px;color:#d9cdc1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.from{font-size:12px;color:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--ink);margin-right:4px}
.tag.acc{background:var(--accent);color:#170d08;border-color:var(--accent)}
.city{font-family:Fraunces,serif;font-size:18px;margin:18px 0 -4px;display:flex;justify-content:space-between;align-items:baseline}
.city span{font-family:Inter;font-size:12px;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:48px 16px;line-height:1.5}
.empty .big{font-size:40px;margin-bottom:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(20,17,15,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px calc(var(--sr) + 6px) calc(var(--sb) + 8px) calc(var(--sl) + 6px);display:flex;justify-content:space-around;z-index:10}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim);font-weight:500;padding:4px 6px;min-width:64px}
nav button .i{font-size:22px;filter:grayscale(1);opacity:.55}
nav button.on{color:var(--ink)}
nav button.on .i{filter:none;opacity:1}
.fab{position:fixed;right:calc(var(--sr) + 18px);bottom:calc(var(--sb) + 82px);width:56px;height:56px;border-radius:50%;background:var(--accent);color:#170d08;font-size:30px;box-shadow:0 10px 24px rgba(0,0,0,.4);z-index:11;display:flex;align-items:center;justify-content:center}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--bg2);width:100%;max-width:720px;max-height:calc(100vh - var(--st) - 24px);max-height:calc(100dvh - var(--st) - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:10px calc(var(--sr) + 18px) calc(var(--sb) + 22px) calc(var(--sl) + 18px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-x{position:sticky;top:0;float:right;margin:0 -6px -38px 0;z-index:6;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15)}
.sheet{overscroll-behavior:contain}
.sheet-bg.show{padding-top:calc(var(--st) + 10px)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:Fraunces,serif;font-size:22px;margin:0 0 14px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:600;font-size:16px;text-align:center;text-decoration:none}
.btn.p{background:var(--accent);color:#170d08}
.btn.g{background:var(--card);border:1px solid var(--line)}
.btn.d{color:#ff8a8a}
.btn.sm{padding:10px 14px;font-size:14px;width:auto;display:inline-block}
.btn:disabled{opacity:.5}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.btns.h{flex-direction:row}
.btns.h>*{flex:1}
.stars{display:flex;gap:4px}
.stars button{font-size:30px;line-height:1;color:var(--line);padding:2px}
.stars button.on{color:var(--star)}
.upl input{display:none}
.hero{margin:-10px -18px 12px;height:170px;background:#000 center/cover no-repeat;position:relative;border-radius:22px 22px 0 0}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,var(--bg2));border-radius:inherit}
.detail-top{display:flex;gap:14px;margin-bottom:12px;position:relative;z-index:1}
.hero+.detail-top{margin-top:-70px}
.detail-top .cover{width:108px;flex:none}
.detail-top.sq .cover{aspect-ratio:1/1}
.detail-top h2{margin:0 0 6px}
.detail-top .info{padding-top:4px;min-width:0}
.hero+.detail-top .info{padding-top:70px}
.overview{font-size:14px;color:#d9cdc1;line-height:1.5}
.rev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.rev .who{font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.rev .who span{color:var(--star);font-size:14px}
.rev p{margin:6px 0 0;font-size:14px;color:#e2d7cc;white-space:pre-wrap}
.reacts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.reacts button{font-size:16px;padding:4px 9px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);filter:grayscale(.7);opacity:.7}
.reacts button.on{filter:none;opacity:1;border-color:var(--accent)}
.got{font-size:13px;margin-top:8px;color:var(--mute)}
.sec{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;margin:18px 0 8px}
.small{font-size:12px;color:var(--mute);line-height:1.5}
.provs{display:flex;flex-wrap:wrap;gap:8px}
.prov{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 9px 5px 5px;font-size:12px;font-weight:500}
.prov img{width:26px;height:26px;border-radius:6px}
.prov-group{margin-bottom:10px}
.prov-group .meta{margin-bottom:6px}
.results{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.res{display:flex;gap:10px;align-items:center;text-align:left;padding:6px;border-radius:12px;background:var(--card);border:1px solid var(--line);width:100%}
.res img,.res .noimg{width:40px;height:60px;border-radius:6px;object-fit:cover;flex:none;background:var(--line)}
.res b{display:block;font-size:14px}
.picked{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:14px}
.picked .cover{width:80px;flex:none}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:52vh;overflow-y:auto}
.pgrid button{border-radius:8px;overflow:hidden;aspect-ratio:2/3;border:2px solid transparent;background:var(--card)}
.pgrid button.on{border-color:var(--accent)}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:20px}
.stepper b{min-width:28px;text-align:center;font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-family:Fraunces,serif;font-size:26px}
.tile span{font-size:12px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.bar{height:8px;border-radius:9px;background:var(--bg2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.tl{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.tl .cover{width:36px;flex:none;border-radius:5px}
.tl .d{font-size:12px;color:var(--mute);min-width:44px}
.couple{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 0 6px}
.couple img,.couple .noph{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);margin-bottom:10px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:40px}
.couple h3{font-family:Fraunces,serif;font-size:26px;margin:0}
.swatches{display:flex;gap:10px}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
.pgrid2{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.pgrid2{grid-template-columns:1fr 1fr}}
.pcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pbanner{height:80px;background-size:cover;background-position:center}
.pbody{display:flex;gap:10px;padding:0 12px 10px;align-items:flex-start}
.pav{margin-top:-26px;border:3px solid var(--card);border-radius:50%;display:flex;flex:none}
.favrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px 12px}
.favrow span{aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--bg2)}
.favrow img,.slot img{width:100%;height:100%;object-fit:cover;display:block}
.favs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:block;width:100%}
.slot.empty{border-style:dashed;background:transparent}
.slot.add{font-size:26px;color:var(--mute)}
.x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:2}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.fcard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.collage{display:grid;grid-template-columns:1fr 1fr;gap:3px;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--bg2)}
.collage span{overflow:hidden;background:var(--bg2);display:flex}
.collage img{width:100%;height:100%;object-fit:cover}
.fname{font-weight:600;margin-top:8px;font-size:15px}
.mcard{position:relative;height:min(52vh,500px);aspect-ratio:2/3;max-width:100%;margin:0 auto;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 14px 40px rgba(0,0,0,.5);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.mcard img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.minfo{position:absolute;left:0;right:0;bottom:0;padding:50px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.92));color:#fff;font-size:13px}
.minfo b{font-family:Fraunces,serif;font-size:22px;display:block;margin-bottom:2px}
.mhint{margin-top:6px;color:var(--accent);font-weight:600}
.stamp{position:absolute;top:22px;padding:6px 12px;border:3px solid;border-radius:10px;font-weight:800;font-size:22px;letter-spacing:1px;opacity:0;transform:rotate(-12deg);z-index:2}
.stamp.yes{left:18px;color:#3ecf8e;border-color:#3ecf8e}
.stamp.no{right:18px;color:#ff6b6b;border-color:#ff6b6b;transform:rotate(12deg)}
.mbtns{display:flex;justify-content:center;align-items:center;gap:22px;margin:16px 0 4px}
.mb{height:56px;padding:0 22px;border-radius:99px;font-size:17px;font-weight:700;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.mb.no{color:#ff6b6b}
.mb.info{width:46px;height:46px;padding:0;font-size:18px;border-radius:50%}
.mb.yes{background:var(--accent);border-color:var(--accent);color:#170d08}
.mrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.mrow button{flex:none;width:84px;text-align:left;font-size:12px}
.mrow img{width:84px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;display:block;margin-bottom:4px}
.mdot{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--accent);color:#170d08;font-size:11px;font-weight:700;font-style:normal;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 150px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:500;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
#auth{display:none;max-width:420px;margin:0 auto;padding-top:8vh}
#auth .logo{font-size:56px;text-align:center}
#auth h1{text-align:center;margin:6px 0 4px;font-size:34px}
#auth p{text-align:center;color:var(--mute);margin:0 0 24px}
#splash{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;transition:opacity .5s}
#splash.show{display:flex}
#splash.out{opacity:0}
#splash img{width:140px;height:140px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);margin-bottom:16px;animation:pop .6s ease-out}
#splash h2{font-family:Fraunces,serif;font-size:32px;margin:0}
#splash p{color:var(--mute);margin:6px 0 0}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.roll{font-family:Fraunces,serif;font-size:22px;text-align:center;padding:30px 0;color:var(--mute)}
.pick-card{text-align:center}
.pick-card .cover{width:150px;margin:0 auto 12px}
.pick-card h3{font-family:Fraunces,serif;font-size:24px;margin:0 0 6px}
.attr{font-size:11px;color:var(--dim);margin-top:6px}
</style>
</head>
<body>

<div id="splash"><img id="splashImg" alt=""><h2 id="splashT"></h2><p id="splashS"></p></div>

<section id="auth">
  <div class="logo">🍿</div>
  <h1>Nosso Cantinho</h1>
  <p>Filmes, séries e lugares de vocês dois</p>
  <div class="seg" style="justify-content:center;margin:0 0 14px"><button class="chip on" data-am="in">Entrar</button><button class="chip" data-am="up">Criar conta</button></div>
  <form id="authForm">
    <div class="field" id="aNameF" style="display:none"><label>Seu nome</label><input id="aName" maxlength="24" autocomplete="nickname"></div>
    <div class="field"><label>E-mail</label><input id="aEmail" type="email" autocomplete="email" autocapitalize="off"></div>
    <div class="field"><label>Senha</label><input id="aPass" type="password" autocomplete="current-password" minlength="6"></div>
    <div class="btns"><button class="btn p" id="aGo" type="submit">Entrar</button><button class="btn g" type="button" id="aForgot">Esqueci a senha</button></div>
    <p class="small" id="aMsg" style="margin-top:14px"></p>
  </form>
</section>

<div class="wrap" id="app" style="display:none">
  <header>
    <img class="av" id="hdrAv" alt="">
    <h1><small id="hello">Nosso cantinho</small><span id="pageTitle">Assistidos</span></h1>
    <button id="bell" aria-label="Novidades" style="display:none">🔔<i></i></button>
  </header>
  <div class="status" id="status"></div>
  <main id="view"></main>
</div>

<script type="module">
// =============== constantes ===============
const PLATFORMS = ["Netflix","Prime Video","Disney+","Max","Apple TV+","Globoplay","Paramount+","YouTube","Cinema","Aluguel/Compra","Outro"];
const GENRES = ["Ação","Aventura","Animação","Comédia","Crime","Documentário","Drama","Família","Fantasia","Ficção científica","Guerra","História","Mistério","Musical","Romance","Suspense","Terror","Faroeste","Reality","Anime"];

const CFG = window.APP_CONFIG || {};
const S = {

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2000); }
function setStatus(m){ const s=$("#status"); s.innerHTML=m||""; s.classList.toggle("show",!!m); }
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const toISO = ms => { const d=new Date(ms); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const fromISO = s => { if(!s) return Date.now(); const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d,12).getTime(); };
const fmtDate = ms => { const d=new Date(ms); return `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`; };
const doneAt = it => it.dateMode==="unknown" ? 0 : (it.doneAt || it.createdAt || 0);
const sortAt = it => it.dateMode==="unknown" ? (it.doneMarkedAt || it.createdAt || 0) : doneAt(it);
const exactDate = it => it.status==="done" && (!it.dateMode || it.dateMode==="exact");
const doneYear = it => it.dateMode==="unknown" ? null : new Date(doneAt(it)).getFullYear();
function whenTxt(it, verb){
  if (it.dateMode==="unknown") return `${verb} (não lembramos quando)`;
  if (it.dateMode==="year") return `${verb} em ${new Date(doneAt(it)).getFullYear()}`;
  return `${verb} em ${fmtDate(doneAt(it))}`;
}
const shortWhen = it => it.dateMode==="unknown" ? "sem data" : it.dateMode==="year" ? String(new Date(doneAt(it)).getFullYear()) : fmtDate(doneAt(it));
function dateField(label, it){
  const mode = (it && it.dateMode) || "exact", ms = it && it.status==="done" && it.dateMode!=="unknown" ? doneAt(it) : Date.now();
  const yNow = new Date().getFullYear(), ySel = new Date(ms).getFullYear();
  const years = []; for (let y=yNow; y>=yNow-40; y--) years.push(y);
  return `<div class="field" data-datefield><label>${label}</label>
    <div class="chips" style="margin-bottom:8px">${[["exact","📅 Sei a data"],["year","🗓️ Só lembro o ano"],["unknown","🤷 Não lembro"]].map(([k,l])=>`<button type="button" class="chip ${k===mode?"on":""}" data-dm="${k}">${l}</button>`).join("")}</div>
    <input type="date" data-dexact value="${toISO(ms)}" max="${today()}" style="${mode==="exact"?"":"display:none"}">
    <select data-dyear style="${mode==="year"?"":"display:none"}">${years.map(y=>`<option value="${y}" ${y===ySel?"selected":""}>${y}</option>`).join("")}</select>
    <div class="small" data-dunk style="${mode==="unknown"?"":"display:none"}">Sem problema — fica sem data e não entra nos meses da retrospectiva.</div></div>`;
}
function wireDateField(root){
  const f = root.querySelector("[data-datefield]"); if (!f) return;
  f.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>{ f.dataset.mode=b.dataset.dm;
    f.querySelectorAll("[data-dm]").forEach(x=>x.classList.toggle("on",x===b));

}
function readDateField(root){
  const f = root.querySelector("[data-datefield]");
  const mode = f.dataset.mode || f.querySelector("[data-dm].on").dataset.dm;
  if (mode==="year"){ const y = +f.querySelector("[data-dyear]").value; return { dateMode:"year", doneAt: new Date(y, 6, 1, 12).getTime() }; }

}

// =============== camada de dados ===============
// Usa Firebase de verdade, ou um mock (window.__MOCK__) para testes.
let API;
async function initAPI(){
  if (window.__MOCK__) { API = window.__MOCK__; return; }
  const v = "10.12.2", base = `https://www.gstatic.com/firebasejs/${v}/`;
  const [{initializeApp}, A, F] = await Promise.all([
    import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")
  ]);
  const app = initializeApp(CFG.firebase);
  // No iPhone (app na Tela de Início) o IndexedDB pode ser apagado ao fechar o app;
  // o localStorage é mais estável. O Firebase migra sozinho quem já estava logado.
  let auth;
  try { auth = A.initializeAuth(app, { persistence: [A.browserLocalPersistence, A.indexedDBLocalPersistence] }); }
  catch(e){ auth = A.getAuth(app); }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(_){}
  let db;
  try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch(e){ db = F.getFirestore(app); }
  API = {
    onAuth: cb => A.onAuthStateChanged(auth, u => cb(u ? { uid:u.uid, email:u.email } : null)),
    signIn: (e,p) => A.signInWithEmailAndPassword(auth, e, p),
    signUp: (e,p) => A.createUserWithEmailAndPassword(auth, e, p),
    reset: e => A.sendPasswordResetEmail(auth, e),
    signOut: () => A.signOut(auth),
    watch: (coll, cb, err) => F.onSnapshot(F.collection(db, coll), s => cb(s.docs.map(d => ({ id:d.id, ...d.data() }))), err),
    add: (coll, data) => F.addDoc(F.collection(db, coll), data),
    update: (path, data) => F.updateDoc(F.doc(db, path), data),
    set: (path, data) => F.setDoc(F.doc(db, path), data, { merge:true }),
    del: path => F.deleteDoc(F.doc(db, path)),
    DEL: () => F.deleteField()
  };
}

// =============== TMDB ===============
const TMDB = {
  ok: () => CFG.tmdbKey && CFG.tmdbKey !== "COLE_AQUI",
  async get(path, params={}){
    const key = CFG.tmdbKey, bearer = key.length > 60;
    const u = new URL("https://api.themoviedb.org/3"+path);
    Object.entries({ language:"pt-BR", ...params }).forEach(([k,v])=>{ if (v!=="" && v!=null) u.searchParams.set(k,v); });
    if (!bearer) u.searchParams.set("api_key", key);
    const r = await fetch(u, bearer ? { headers:{ Authorization:"Bearer "+key } } : {});
    if (!r.ok) throw new Error("tmdb "+r.status);
    return r.json();
  },
  async search(q, type){
    const d = await this.get("/search/"+type, { query:q, include_adult:"false", region:"BR" });
    return (d.results||[]).map(r=>({ ...r, media_type:type })).slice(0,8);
  },
  _cache: {},
  async genres(type){ const k="g"+type; if(!this._cache[k]) this._cache[k]=(await this.get(`/genre/${type}/list`)).genres||[]; return this._cache[k]; },
  async providers(type){
    const k="p"+type; if(this._cache[k]) return this._cache[k];
    const d = await this.get(`/watch/providers/${type}`, { watch_region:"BR" });
    const list = (d.results||[]).sort((a,b)=>((a.display_priorities||{}).BR??a.display_priority??99)-((b.display_priorities||{}).BR??b.display_priority??99));
    const seen = new Set(), out = [];
    for (const p of list){ const n = matchPlatform(p.provider_name); if (seen.has(n) || /amazon channel|apple tv channel|with ads|standard|basic/i.test(p.provider_name)) continue; seen.add(n); out.push({ id:p.provider_id, name:n, logo:p.logo_path }); if (out.length>=14) break; }
    return this._cache[k] = out;
  },
  discover(type, genres, provs, page){
    return this.get(`/discover/${type}`, { sort_by:"popularity.desc", include_adult:"false", watch_region:"BR",
      with_genres: genres.join("|"), with_watch_providers: provs.join("|"),
      with_watch_monetization_types: provs.length ? "flatrate|free|ads" : "",
      "vote_count.gte": type==="movie" ? "80" : "40", page });
  },
  async details(type, id){
    const k = type+id; if (this._cache[k]) return this._cache[k];
    const d = await this.get(`/${type}/${id}`, { append_to_response:"watch/providers,images,videos", include_image_language:"pt,en,null", include_video_language:"pt,en,null" });
    this._cache[k] = d; return d;
  }
};
function provsBR(d){
  const br = d && d["watch/providers"] && d["watch/providers"].results && d["watch/providers"].results.BR;
  if (!br) return null;
  const m = a => (a||[]).sort((x,y)=>(x.display_priority||0)-(y.display_priority||0)).map(p=>({ name:p.provider_name, logo:p.logo_path }));
  return { link: br.link, stream: m(br.flatrate).concat(m(br.free), m(br.ads)), rent: m(br.rent), buy: m(br.buy) };
}
function trailersOf(d){
  const vs = ((d && d.videos && d.videos.results) || []).filter(v=>v.site==="YouTube" && v.key && (v.type==="Trailer" || v.type==="Teaser"));
  const score = v => (v.type==="Trailer"?0:10) + (v.official?0:2) + (v.iso_639_1==="pt"?0:v.iso_639_1==="en"?5:8);
  const sorted = vs.sort((a,b)=>score(a)-score(b));
  const out = [], seen = new Set();
  for (const v of sorted){ const lang = v.iso_639_1==="pt" ? "pt" : "en"; if (seen.has(lang)) continue; seen.add(lang); out.push({ key:v.key, lang, name:v.name }); }
  return out.slice(0,2);
}
function trailerHTML(d){
  const ts = trailersOf(d); if (!ts.length) return "";
  const lbl = t => ts.length>1 ? (t.lang==="pt" ? "▶ Trailer em português" : "▶ Trailer original") : "▶ Ver trailer";
  return `<div class="chips" style="margin:10px 0">${ts.map(t=>`<button type="button" class="chip tr" data-yt="${esc(t.key)}">${lbl(t)}</button>`).join("")}</div>`;
}
function openTrailer(key){
  const ov = document.createElement("div"); ov.id = "trPlayer"; ov.className = "sheet-bg show"; ov.style.cssText = "z-index:80;align-items:center;background:rgba(0,0,0,.92)";

    <div style="position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000">
      <iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(key)}?autoplay=1&playsinline=1&rel=0" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
    <a class="small" href="https://www.youtube.com/watch?v=${encodeURIComponent(key)}" target="_blank" rel="noopener" style="display:block;text-align:center;margin-top:12px;text-decoration:underline">Abrir no YouTube</a></div>`;
  document.body.appendChild(ov);

document.addEventListener("click", e=>{ const b = e.target.closest("[data-yt]"); if (b){ e.preventDefault(); e.stopPropagation(); openTrailer(b.dataset.yt); } }, true);
function provsHTML(p){
  if (!p) return `<div class="small">Não encontramos onde assistir no Brasil agora.</div>`;
  const g = (t, list) => list.length ? `<div class="prov-group">${t?`<div class="meta">${t}</div>`:""}<div class="provs">${list.map(x=>`<span class="prov">${x.logo?`<img src="${IMG}w92${esc(x.logo)}" alt="">`:""}${esc(x.name)}</span>`).join("")}</div></div>` : "";
  const paid = g("Alugar", p.rent) + g("Comprar", p.buy);
  let h;
  if (p.stream.length){

    if (paid) h += `<button type="button" class="small" style="text-decoration:underline;margin:-2px 0 8px" onclick="this.nextElementSibling.style.display='block';this.remove()">Ver opções de aluguel e compra</button><div style="display:none">${paid}</div>`;
  } else if (paid){
    h = `<div class="small" style="margin-bottom:8px">Não está em nenhum streaming agora — dá pra alugar ou comprar:</div>` + paid;
  } else h = `<div class="small">Não está disponível em nenhuma plataforma no Brasil agora.</div>`;
  return h + (p.link ? `<div class="attr">Dados de disponibilidade: <a href="${esc(p.link)}" target="_blank" rel="noopener">JustWatch</a> via TMDB</div>` : "");

// =============== helpers de UI ===============
function nameOf(uid){ if(!uid) return "alguém"; if(uid===S.me) return "você"; return (S.people[uid] && S.people[uid].name) || "seu amor"; }
function nameRaw(uid){ return (S.people[uid] && S.people[uid].name) || (uid===S.me?"Você":"Seu amor"); }
function other(){ return Object.keys(S.people).find(id => id !== S.me) || null; }
function hue(str){ let h=0; for(const c of String(str)) h=(h*31+c.charCodeAt(0))%360; return h; }
function coverSrc(it, size="w342"){
  if (it.cover && /^data:image\//.test(it.cover)) return it.cover;
  if (it.poster) return IMG+size+it.poster;
  return "";
}
function coverHTML(it, badge=""){
  const src = coverSrc(it);
  if (src) return `<div class="cover">${badge}<img src="${esc(src)}" alt="" loading="lazy"></div>`;
  const h = hue(it.title||"x");
  return `<div class="cover">${badge}<div class="ph" style="background:linear-gradient(160deg,hsl(${h},55%,42%),hsl(${(h+40)%360},60%,18%))">${esc(it.title||"")}</div></div>`;
}
const starStr = n => { n=Math.round(n||0); return n ? "★".repeat(n)+"☆".repeat(5-n) : ""; };
const avgRating = it => { const r=Object.values(it.reviews||{}).map(x=>x&&x.rating).filter(Boolean); return r.length ? r.reduce((a,b)=>a+b,0)/r.length : 0; };
const progTag = it => it.progress && it.progress.s ? `<span class="tag acc">T${it.progress.s} · E${it.progress.e||1}</span>` : "";
const match = it => { const q=S.q.trim().toLowerCase(); return !q || (it.title||"").toLowerCase().includes(q) || (it.city||"").toLowerCase().includes(q); };
const segHTML = (opts, cur, key) => `<div class="seg">${opts.map(([k,l])=>`<button class="chip ${cur===k?"on":""}" data-seg="${key}" data-val="${k}">${l}</button>`).join("")}</div>`;
const emptyHTML = (icon, text) => `<div class="empty"><div class="big">${icon}</div>${text}</div>`;
// recFor: "other" = pro outro (quem não criou) · "self" = quem criou quer ver · "both" = juntos
const isMine = i => i.createdBy===S.me;
const forMeFn = i => i.recFor==="other" ? !isMine(i) : i.recFor==="self" ? isMine(i) : i.recFor===S.me;
const forPartnerFn = i => i.recFor==="other" ? isMine(i) : i.recFor==="self" ? !isMine(i) : (!!i.recFor && i.recFor!=="both" && i.recFor!==S.me);
const togetherFn = i => i.recFor==="both" || !i.recFor;
const watchingFn = i => i.progress && i.progress.s;
const pName = () => other() ? nameRaw(other()) : "ele(a)";
function whoText(it){
  const pn = esc(pName()), cn = esc(nameRaw(it.createdBy));
  if (togetherFn(it)) return isMine(it) ? "Você sugeriu pra vocês dois" : `${cn} sugeriu pra vocês dois`;
  if (isMine(it)) return forMeFn(it) ? "Você quer ver" : `Você indicou pra ${pn}`;
  return forMeFn(it) ? `${cn} indicou pra você` : `${cn} quer ver`;
}

function applyTheme(){
  const c = THEMES[S.settings.theme] || THEMES.coral;
  document.documentElement.style.setProperty("--accent", c);
}

  if (!S.me) return;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===S.tab));
  if (S.newsReady) S.visited.add(S.tab);

  const o = other(), st = S.settings;

  $("#fab").style.display = S.tab==="us" ? "none" : "flex";

function viewWatch(tab){
  const mt = tab==="movies" ? "filme" : "serie";
  const all = S.items.filter(i=>i.kind==="watch" && i.mediaType===mt);
  const todo = all.filter(i=>i.status==="todo"), done = all.filter(i=>i.status==="done");
  const cnt = n => n ? ` (${n})` : "";
  const segs = [];
  if (mt==="serie") segs.push(["watching","▶ Assistindo"+cnt(todo.filter(watchingFn).length)]);
  segs.push(["forme","Pra mim"+cnt(todo.filter(forMeFn).length)], ["forpartner","Pra "+esc(pName())+cnt(todo.filter(forPartnerFn).length)],
    ["together","Juntos"+cnt(todo.filter(togetherFn).length)], ["done","✓ Assistidos"+cnt(done.length)]);
  let f = S.filter[tab]; if (!segs.find(x=>x[0]===f)) f = S.filter[tab] = "forme";
  const fn = { watching:watchingFn, forme:forMeFn, forpartner:forPartnerFn, together:togetherFn }[f];
  const base = f==="done" ? done : todo.filter(fn);
  const genres = [...new Set(base.flatMap(i=>i.genres||[]))].sort((a,b)=>a.localeCompare(b));
  if (S.genre[tab] && !genres.includes(S.genre[tab])) S.genre[tab] = "";
  const gsel = S.genre[tab];
  const list = base.filter(i=>!gsel || (i.genres||[]).includes(gsel)).filter(match)
    .sort((a,b)=> f==="done" ? sortAt(b)-sortAt(a) : (b.createdAt||0)-(a.createdAt||0));
  let h = segHTML(segs, f, tab);
  if (genres.length) h += `<div class="seg" style="padding-top:2px">${[["","Todos os gêneros"], ...genres.map(g=>[g,g])].map(([k,l])=>`<button class="chip ${gsel===k?"on":""}" data-genre="${esc(k)}" style="font-size:13px;padding:6px 12px">${esc(l)}</button>`).join("")}</div>`;
  h += `<div class="toolbar"><input id="q" placeholder="Buscar…" autocomplete="off">${f!=="done" ? `<button class="btn g" id="rollBtn">🎲 Sortear</button>`:""}<button class="btn g" id="matchBtn" style="position:relative;padding:0 14px">🤝 Topa?${(()=>{ const n=matchPending(tab==="series"?"tv":"movie"); const d=S.match[tab==="series"?"tv":"movie"]; return n && d && d.createdBy!==S.me ? `<i class="mdot">${n}</i>` : ""; })()}</button></div>`;
  const word = mt==="filme" ? "filme" : "série";
  if (!list.length){
    if (base.length) return h + emptyHTML("🔎", "Nada encontrado com esse filtro.");
    const msg = {

}

function swipeToClose(sh, close){
  let y0=null, dy=0, active=false;
  sh.addEventListener("touchstart", e=>{ if (sh.scrollTop>0 || S.mustName) { y0=null; return; } y0=e.touches[0].clientY; dy=0; active=false; }, { passive:true });
  sh.addEventListener("touchmove", e=>{ if (y0==null) return; dy = e.touches[0].clientY - y0;
    if (dy>8 && sh.scrollTop<=0){ active=true; sh.style.transition="none"; sh.style.transform=`translateY(${dy}px)`; } }, { passive:true });
  sh.addEventListener("touchend", ()=>{ if (!active){ y0=null; return; } sh.style.transition="transform .2s"; 
    if (dy>110){ sh.style.transform="translateY(100%)"; setTimeout(()=>{ sh.style.transition=""; sh.style.transform=""; close(); }, 180); }
    else sh.style.transform=""; y0=null; active=false; });
}

function shrink(file, square, W=360, HH){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = ()=>{
      const H = HH || (square ? W : Math.round(W*1.5));
      const c = document.createElement("canvas"); c.width=W; c.height=H;
      const x = c.getContext("2d"); const s = Math.max(W/img.width, H/img.height);
      x.drawImage(img, (W-img.width*s)/2, (H-img.height*s)/2, img.width*s, img.height*s);
      URL.revokeObjectURL(url);
      let q=.8, out=c.toDataURL("image/jpeg", q);
      while (out.length > 180000 && q > .4){ q-=.1; out=c.toDataURL("image/jpeg", q); }
      res(out);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

      root.querySelector("#manualFields").innerHTML = show ? `<label>Nome</label><input id="fTitle" value="${esc(st.title)}" placeholder="Nome do filme ou série">
        <div style="margin-top:10px">${chipsInput("ftype", [["filme","Filme"],["serie","Série"]], st.mediaType)}</div>` : "";
      if (show){ wireChips(root.querySelector("#manualFields")); root.querySelector('[data-chips="ftype"]').setAttribute("data-req","");
        root.querySelector("#fTitle").oninput = e=>{ st.title=e.target.value; };
        root.querySelector('[data-chips="ftype"]').addEventListener("change", e=>{ st.mediaType=e.currentTarget.dataset.val; drawPicked(); });
      }
    };
    const setPlat = name => { const box = root.querySelector('[data-chips="fplat"]');
      if (![...box.querySelectorAll("button")].some(x=>x.dataset.v===name)){ const b=document.createElement("button"); b.type="button"; b.className="chip"; b.dataset.v=name; b.textContent=name; box.insertBefore(b, box.lastElementChild.previousElementSibling); }
      box.dataset.val=name; box.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x.dataset.v===name)); };

    async function choose(r){
      r.media_type = r.media_type || (st.mediaType==="serie" ? "tv" : "movie");
      st.tmdb = { id:r.id, type:r.media_type }; st.title = r.title||r.name; st.year = (r.release_date||r.first_air_date||"").slice(0,4);
      st.mediaType = r.media_type==="tv"?"serie":"filme"; st.poster = r.poster_path||""; st.backdrop = r.backdrop_path||""; st.overview = r.overview||""; st.cover="";
      root.querySelector("#searchBox").style.display="none"; root.querySelector("#formBox").style.display="block";
      drawManual(false); drawPicked();
      root.querySelector("#provBox").innerHTML = `<div class="small" style="margin-bottom:8px">Buscando onde assistir…</div>`;
      try {
        const d = await TMDB.details(r.media_type, r.id);
        st.genres = (d.genres||[]).map(g=>normGenre(g.name)).flat().filter((g,i,a)=>a.indexOf(g)===i).slice(0,3); st.runtime = d.runtime||0; st.seasons = d.number_of_seasons||0;
        setMulti(root, "fgen", st.genres);
        st.overview = d.overview || st.overview;
        const p = provsBR(d); st.providers = p;
        root.querySelector("#provBox").innerHTML = `<div style="margin-bottom:10px">${provsHTML(p)}</div><div class="small" style="margin-bottom:6px">Plataforma principal:</div>`;
        const first = p && p.stream[0] && matchPlatform(p.stream[0].name);
        if (first) setPlat(first); else if (p && (p.rent.length||p.buy.length)) setPlat("Aluguel/Compra");
        drawPicked();
      } catch(e){ root.querySelector("#provBox").innerHTML = ""; }
    }

    if (editing){ drawPicked(); drawManual(!st.tmdb); }
    else {
      root.querySelector("#manual").onclick = ()=>{ st.tmdb=null; st.title=val(root,"#tq"); root.querySelector("#searchBox").style.display="none"; root.querySelector("#formBox").style.display="block"; root.querySelector("#provBox").innerHTML=""; drawManual(true); drawPicked(); root.querySelector("#fTitle").focus(); };
      const tq = root.querySelector("#tq"), tres = root.querySelector("#tres"); let tmr, seq=0;
      setTimeout(()=>tq.focus(), 300);
      tq.oninput = ()=>{
        clearTimeout(tmr); const q = tq.value.trim();
        if (q.length<2 || !TMDB.ok()){ tres.innerHTML=""; return; }
        tmr = setTimeout(async ()=>{
          const my = ++seq; tres.innerHTML = `<div class="small">Buscando…</div>`;
          try {
            const rs = await TMDB.search(q, st.mediaType==="serie"?"tv":"movie"); if (my!==seq) return;
            tres.innerHTML = rs.length ? rs.map((r,i)=>`<button type="button" class="res" data-i="${i}">
              ${r.poster_path?`<img src="${IMG}w92${esc(r.poster_path)}" alt="">`:`<span class="noimg"></span>`}
              <span style="min-width:0"><b>${esc(r.title||r.name)}</b><span class="meta">${(r.release_date||r.first_air_date)?esc((r.release_date||r.first_air_date).slice(0,4)):""}${r.overview?" · "+esc(r.overview.slice(0,60))+"…":""}</span></span></button>`).join("")
              : `<div class="small">Nada encontrado. Tente outro nome ou preencha na mão.</div>`;
            tres.querySelectorAll(".res").forEach(b=>b.onclick=()=>choose(rs[+b.dataset.i]));
          } catch(e){ if (my===seq) tres.innerHTML = `<div class="small">Não consegui buscar agora (${esc(e.message)}). Confira a chave do TMDB no config.js.</div>`; }
        }, 300);
      };
    }

    root.querySelector("#fSave").onclick = async e=>{
      if (!st.title.trim()){ toast("Coloca um nome 🙂"); return; }
      const data = { title: st.title.trim(), mediaType: st.mediaType, year: st.year, poster: st.poster, cover: st.cover, backdrop: st.backdrop,
        overview: st.overview, genres: st.genres, runtime: st.runtime, seasons: st.seasons,
        tmdbId: st.tmdb ? st.tmdb.id : null, tmdbType: st.tmdb ? st.tmdb.type : null, platform: chipVal(root,"fplat") };
      data.genres = getMulti(root, "fgen");
      if (isRec){ if (root.querySelector('[data-chips="ffor"]')) data.recFor = chipVal(root,"ffor") || "other"; data.note = val(root,"#fNote"); }
      if (root.querySelector("[data-datefield]")){ Object.assign(data, readDateField(root)); data.occasion = val(root,"#fOcc"); }
      e.target.disabled = true;
      try {
        if (editing){ await API.update("items/"+it.id, data); toast("Salvo ✓"); openDetail(it.id); return; }
        Object.assign(data, { kind:"watch", status, createdBy:S.me, createdAt:Date.now(), reviews:{} });
        if (status==="done"){ data.doneBy=S.me; data.doneMarkedAt=Date.now(); }
        const rate = +(root.querySelector('[data-stars="frate"]')?.dataset.val||0), rev = val(root,"#fRev");
        if (!isRec && (rate||rev)) data.reviews[S.me] = { rating:rate, text:rev, at:Date.now() };
        await API.add("items", data);
        const wantTab = data.mediaType==="serie" ? "series" : "movies";
        const wantSeg = isRec ? ({other:"forpartner", self:"forme", both:"together"}[data.recFor]) : "done";
        if (S.tab!==wantTab || S.filter[wantTab]!==wantSeg){ S.tab = wantTab; S.filter[wantTab] = wantSeg; render(); }
        toast(isRec ? (data.recFor==="other" ? `Indicado pra ${pName()} 💌` : "Adicionado à lista ✓") : "Adicionado ✓"); closeSheet();
      } catch(err){ e.target.disabled=false; writeErr(err); }
    };
  });
}
function matchPlatform(name){
  const n = name.toLowerCase();
  if (n.includes("netflix")) return "Netflix";
  if (n.includes("amazon") || n.includes("prime")) return "Prime Video";
  if (n.includes("disney")) return "Disney+";
  if (n==="max" || n.includes("hbo") || n.startsWith("max ")) return "Max";
  if (n.includes("apple")) return "Apple TV+";
  if (n.includes("globo")) return "Globoplay";
  if (n.includes("paramount")) return "Paramount+";
  if (n.includes("youtube")) return "YouTube";
  return name.replace(/ Amazon Channel$| Apple TV Channel$/,"");
}

function openDetail(id){
  const it = S.items.find(i=>i.id===id); if(!it) return closeSheet();
  const isPlace = it.kind==="place", done = it.status==="done", revs = it.reviews || {};
  let html = "";
  if (it.backdrop) html += `<div class="hero" style="background-image:url('${IMG}w780${esc(it.backdrop)}')"></div>`;
  const metaBits = isPlace ? [it.category, it.city] : [it.mediaType==="serie"?"Série":"Filme", it.year, it.seasons?`${it.seasons} temp.`:"", it.runtime?`${it.runtime} min`:"", (it.genres||[]).join(", ")];
  html += `<div class="detail-top ${isPlace?"sq":""}">${coverHTML(it)}<div class="info">
      <h2>${esc(it.title)}</h2>
      <div class="meta">${metaBits.filter(Boolean).map(esc).join(" · ")}</div>
      <div style="margin-top:8px">${progTag(it)}${it.platform?`<span class="tag">📺 ${esc(it.platform)}</span>`:""}</div>
      ${avgRating(it)?`<div style="color:var(--star);margin-top:8px">${starStr(avgRating(it))}</div>`:""}
      <div class="small" style="margin-top:6px">${done ? `${whenTxt(it, isPlace?"Fomos":"Assistimos")}${it.occasion?` · ${esc(it.occasion)}`:""}` :
        (!isPlace ? whoText(it) : `Adicionado por ${esc(nameOf(it.createdBy))}`)}</div>
    </div></div>`;
  if (it.note) html += `<div class="sec">${isPlace?"Notas":done?"Por que foi indicado":"Por que assistir"}</div><div class="rev"><p style="margin:0">${esc(it.note)}</p></div>`;
  if (it.overview) html += `<div class="sec">Sinopse</div><div class="overview">${esc(it.overview)}</div>`;
  if (!isPlace && it.tmdbId) html += `<div id="trBox"></div><div class="sec">Onde assistir no Brasil</div><div id="liveProv"><div class="small">Buscando…</div></div>`;
  if (isPlace){
    const q = encodeURIComponent([it.title, it.address, it.city].filter(Boolean).join(", "));
    html += `<div class="sec">Mapa</div><div class="btns h"><a class="btn g" href="https://maps.apple.com/?q=${q}" target="_blank" rel="noopener">🗺️ Apple Maps</a><a class="btn g" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">📍 Google Maps</a></div>`;
  }
  if (!done && it.mediaType==="serie"){
    const p = it.progress || { s:0, e:0 };
    html += `<div class="sec">Onde vocês pararam</div><div class="card" style="display:flex;justify-content:space-around;flex-wrap:wrap;gap:12px">
      <div><div class="small" style="text-align:center;margin-bottom:6px">Temporada${it.seasons?` (de ${it.seasons})`:""}</div><div class="stepper"><button data-step="s" data-d="-1">−</button><b id="ps">${p.s||"–"}</b><button data-step="s" data-d="1">+</button></div></div>
      <div><div class="small" style="text-align:center;margin-bottom:6px">Episódio</div><div class="stepper"><button data-step="e" data-d="-1">−</button><b id="pe">${p.e||"–"}</b><button data-step="e" data-d="1">+</button></div></div></div>`;
  }
  if (done){
    html += `<div class="sec">Comentários</div>`;
    const mine = revs[S.me];
    const reactsOn = r => Object.entries((r&&r.reactions)||{});
    html += `<div class="rev" style="border-color:color-mix(in srgb,var(--accent) 40%,var(--line))"><div class="who"><span style="display:flex;align-items:center;gap:8px;color:var(--ink)">${avatarHTML(S.me,24)}Você</span> ${mine&&mine.rating?`<span>${starStr(mine.rating)}</span>`:""}</div>
      ${mine&&mine.text?`<p>${esc(mine.text)}</p>`:""}
      ${reactsOn(mine).length?`<div class="got">${reactsOn(mine).map(([u,e])=>`${e} de ${esc(nameRaw(u))}`).join(" · ")}</div>`:""}
      <button class="small" id="dRev" style="margin-top:8px;text-decoration:underline">${mine?"Editar meu comentário":"Escrever meu comentário"}</button></div>`;
    Object.keys(revs).filter(u=>u!==S.me).forEach(uid=>{
      const r = revs[uid]; if(!r) return;
      const my = r.reactions && r.reactions[S.me];
      html += `<div class="rev"><div class="who"><span style="display:flex;align-items:center;gap:8px;color:var(--ink)">${avatarHTML(uid,24)}${esc(nameRaw(uid))}</span> ${r.rating?`<span>${starStr(r.rating)}</span>`:""}</div>${r.text?`<p>${esc(r.text)}</p>`:""}
        <div class="reacts">${REACTIONS.map(e=>`<button data-react="${uid}" data-e="${e}" class="${my===e?"on":""}">${e}</button>`).join("")}</div></div>`;
    });
    const o = other();
    if (o && !revs[o]) html += `<div class="small">${esc(nameRaw(o))} ainda não comentou.</div>`;
  }
  html += `<div class="btns" style="margin-top:18px">`;
  if (!done) html += `<button class="btn p" id="dDone">${isPlace?"📍 Fomos!":"✓ Assistimos"}</button>`;

      const v = cur===b.dataset.e ? API.DEL() : b.dataset.e;
      root.querySelectorAll(`[data-react="${b.dataset.react}"]`).forEach(x=>x.classList.toggle("on", x===b && cur!==b.dataset.e));

      root.querySelector("#ps").textContent = p.s||"–"; root.querySelector("#pe").textContent = p.e||"–";
      clearTimeout(pt); pt=setTimeout(()=>API.update("items/"+it.id, { progress: p.s ? p : API.DEL() }).catch(writeErr), 700);

    const lp = root.querySelector("#liveProv");

      if (!TMDB.ok()) lp.innerHTML = `<div class="small">Configure a chave do TMDB para ver.</div>`;

    }
  });
}

  const mt = S.tab==="series" ? "serie" : "filme", tt = mt==="serie" ? "tv" : "movie";
  const pool0 = S.items.filter(i=>i.kind==="watch" && i.status==="todo" && i.mediaType===mt);
  const f = S.filter[S.tab], defWho = ["forme","forpartner","together"].includes(f) ? f : "all";
  const genres = [...new Set(pool0.flatMap(i=>i.genres||[]))].sort();
  const plats = [...new Set(pool0.map(i=>i.platform).filter(Boolean))];
  let mode = pool0.length ? "list" : "hot";
  openSheet(`<h2>🎲 ${mt==="serie"?"Qual série hoje?":"Qual filme hoje?"}</h2>
    <div class="seg" style="margin-top:-6px">${[["list","📋 Da nossa lista"],["hot","🔥 Em alta agora"]].map(([k,l])=>`<button class="chip ${mode===k?"on":""}" data-mode="${k}">${l}</button>`).join("")}</div>
    <div id="mList">
      ${pool0.length ? `
      <div class="field"><label>De qual lista</label>${chipsInput("rwho", [["all","Todas"],["forme","Pra mim"],["forpartner","Pra "+pName()],["together","Juntos"]], defWho)}</div>
      ${genres.length?`<div class="field"><label>Gênero</label>${chipsInput("rgen", [["","Qualquer"], ...genres.map(g=>[g,g])], "")}</div>`:""}
      ${plats.length?`<div class="field"><label>Plataforma</label>${chipsInput("rplat", [["","Qualquer"], ...plats.map(p=>[p,p])], "")}</div>`:""}`
      : `<div class="small" style="margin:10px 0">A lista de vocês está vazia — experimente o 🔥 Em alta.</div>`}
    </div>
    <div id="mHot" style="display:none">
      <p class="small" style="margin:4px 0 12px">${mt==="serie"?"Séries":"Filmes"} mais populares do momento. Escolha quantos gêneros e plataformas quiser — ou nenhum, pra valer qualquer um.</p>
      <div class="field"><label>Gêneros</label><div id="hGen" class="small">Carregando…</div></div>
      <div class="field"><label>Plataformas</label><div id="hProv" class="small">Carregando…</div></div>
    </div>
    <div id="rollOut"></div>
    <div class="btns"><button class="btn p" id="rollGo">Sortear</button><button class="btn g" id="rollX">Fechar</button></div>`, root=>{
    wireChips(root); root.querySelectorAll("[data-chips]").forEach(b=>b.setAttribute("data-req",""));
    root.querySelector("#rollX").onclick = closeSheet;
    const out = root.querySelector("#rollOut"), go = root.querySelector("#rollGo");
    let hotLoaded = false;
    const setMode = m => {
      mode = m; out.innerHTML = ""; go.textContent = "Sortear"; go.disabled = (m==="list" && !pool0.length);
      root.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("on", b.dataset.mode===m));
      root.querySelector("#mList").style.display = m==="list" ? "block" : "none";
      root.querySelector("#mHot").style.display = m==="hot" ? "block" : "none";
      if (m==="hot" && !hotLoaded){ hotLoaded = true; loadHot(); }
    };
    root.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
    async function loadHot(){
      if (!TMDB.ok()){ root.querySelector("#hGen").textContent = "Configure a chave do TMDB."; root.querySelector("#hProv").textContent=""; return; }
      try {
        const [gs, ps] = await Promise.all([TMDB.genres(tt), TMDB.providers(tt)]);
        root.querySelector("#hGen").outerHTML = `<div class="chips" data-multi="hgen">${gs.map(g=>`<button type="button" class="chip" data-v="${g.id}">${esc(g.name)}</button>`).join("")}</div>`;
        root.querySelector("#hProv").outerHTML = `<div class="chips" data-multi="hprov">${ps.map(p=>`<button type="button" class="chip" data-v="${p.id}" style="display:flex;align-items:center;gap:6px;padding-left:6px">${p.logo?`<img src="${IMG}w92${esc(p.logo)}" style="width:20px;height:20px;border-radius:5px" alt="">`:""}${esc(p.name)}</button>`).join("")}</div>`;
        wireMulti(root.querySelector("#mHot"));
      } catch(e){ root.querySelector("#hGen").textContent = "Não consegui carregar agora."; root.querySelector("#hProv").textContent=""; }
    }
    const spin = (titles, done) => { let n=0; const steps=Math.min(14, 6+titles.length); const t=()=>{ if(n++<steps){ out.innerHTML=`<div class="roll">${esc(titles[Math.floor(Math.random()*titles.length)])}</div>`; setTimeout(t, 60+n*12); } else done(); }; t(); };

    function rollList(){
      const who = chipVal(root,"rwho"), plat = chipVal(root,"rplat"), gen = chipVal(root,"rgen");
      const wf = { forme:forMeFn, forpartner:forPartnerFn, together:togetherFn }[who];
      const pool = pool0.filter(i => (!wf || wf(i)) && (!plat || i.platform===plat) && (!gen || (i.genres||[]).includes(gen)));
      if (!pool.length){ out.innerHTML = `<div class="small" style="margin:8px 0 12px">Nada com esses filtros.</div>`; return; }
      const it = pool[Math.floor(Math.random()*pool.length)];
      spin(pool.map(i=>i.title), ()=>{
        out.innerHTML = `<div class="pick-card">${coverHTML(it)}<h3>${esc(it.title)}</h3><div>${it.platform?`<span class="tag">📺 ${esc(it.platform)}</span>`:""}${progTag(it)}</div>
          ${it.note?`<p class="small">“${esc(it.note)}”</p>`:""}<button class="btn g sm" id="rollOpen" style="margin:10px 0 6px">Ver detalhes</button></div>`;
        go.textContent = "Sortear de novo";
        root.querySelector("#rollOpen").onclick = ()=>openDetail(it.id);
      });
    }

    const hotCache = {}; const shown = new Set();
    async function rollHot(){
      const gs = getMulti(root,"hgen"), ps = getMulti(root,"hprov");
      const key = gs.join(",")+"|"+ps.join(",");
      const known = new Set(S.items.filter(i=>i.tmdbId).map(i=>i.tmdbType+i.tmdbId));
      go.disabled = true; out.innerHTML = `<div class="roll">Procurando…</div>`;
      try {
        if (!hotCache[key]){
          const first = await TMDB.discover(tt, gs, ps, 1);
          const pages = Math.min(5, first.total_pages||1);
          const rest = pages>1 ? await Promise.all([...Array(pages-1)].map((_,i)=>TMDB.discover(tt, gs, ps, i+2).catch(()=>({results:[]})))) : [];
          hotCache[key] = [first, ...rest].flatMap(d=>d.results||[]);
        }
        let pool = hotCache[key].filter(r=>!known.has(tt+r.id));
        if (!pool.length){ out.innerHTML = `<div class="small" style="margin:8px 0 12px">Nada encontrado com essa combinação. Tente tirar algum filtro.</div>`; go.disabled=false; return; }
        let fresh = pool.filter(r=>!shown.has(r.id)); if (!fresh.length){ shown.clear(); fresh = pool; }
        const r = fresh[Math.floor(Math.random()*fresh.length)]; shown.add(r.id);
        spin(pool.map(x=>x.title||x.name), async ()=>{
          const title = r.title||r.name, year = (r.release_date||r.first_air_date||"").slice(0,4);
          out.innerHTML = `<div class="pick-card">
            <div class="cover"><img src="${IMG}w342${esc(r.poster_path||"")}" alt=""></div>
            <h3>${esc(title)}</h3>
            <div class="meta" style="margin-bottom:8px">${[year, r.vote_average?`★ ${r.vote_average.toFixed(1)} no TMDB`:""].filter(Boolean).join(" · ")}</div>
            ${r.overview?`<p class="small" style="text-align:left;-webkit-line-clamp:5;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden">${esc(r.overview)}</p>`:""}
            <div id="hotProv" style="text-align:left;margin:10px 0"><div class="small">Buscando onde assistir…</div></div>
            <div class="field" style="text-align:left"><label>Adicionar em</label>${chipsInput("hfor", [["both","💑 Juntos"],["self","🙋 Eu quero ver"],["other","💌 Pra "+pName()]], "both")}</div>
            <button class="btn g" id="hotAdd" style="margin-bottom:6px">➕ Adicionar à lista</button></div>`;
          go.textContent = "Sortear outro"; go.disabled = false;
          const box = out.querySelector('[data-chips="hfor"]'); box.setAttribute("data-req",""); wireChips(out);
          let det = null;
          try { det = await TMDB.details(tt, r.id); out.querySelector("#hotProv").innerHTML = trailerHTML(det) + provsHTML(provsBR(det)); }
          catch(_){ out.querySelector("#hotProv").innerHTML = ""; }
          out.querySelector("#hotAdd").onclick = async e=>{
            e.target.disabled = true;
            try { const d = det || await TMDB.details(tt, r.id); await addFromTmdb(tt, d, chipVal(out,"hfor")||"both", r); e.target.textContent = "✓ Adicionado"; }
            catch(err){ e.target.disabled = false; writeErr(err); }
          };
        });
      } catch(e){ out.innerHTML = `<div class="small" style="margin:8px 0 12px">Não consegui buscar agora.</div>`; go.disabled=false; }
    }
    go.onclick = ()=> mode==="hot" ? rollHot() : rollList();
    setMode(mode);
  });
}

function avatarHTML(uid, size=40){
  const p = S.people[uid] || {};
  if (p.photo) return `<img src="${esc(p.photo)}" alt="" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;flex:none">`;
  const n = (p.name || (uid===S.me?"V":"?")).trim()[0] || "?", h = hue(uid||"x");
  return `<span style="width:${size}px;height:${size}px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;background:hsl(${h},45%,38%);color:#fff;font-weight:700;font-size:${Math.round(size*.42)}px">${esc(n.toUpperCase())}</span>`;
}
function bannerStyle(p){
  const b = p && p.banner;
  if (b && /^data:image\//.test(b)) return `background-image:url('${b}')`;
  if (b) return `background-image:url('${IMG}w780${esc(b)}')`;
  const h = hue((p&&p.name)||"x");
  return `background:linear-gradient(135deg,hsl(${h},45%,30%),hsl(${(h+60)%360},50%,14%))`;
}
const favPoster = f => f && f.poster ? `<img src="${IMG}w185${esc(f.poster)}" alt="">` : "";
function profileCard(uid){
  if (!uid) return `<div class="pcard" style="opacity:.7"><div class="pbanner" style="${bannerStyle({name:"?"})}"></div><div class="pbody"><div class="pav">${avatarHTML("?",56)}</div>
    <div style="padding-top:6px"><b>${esc(pName())}</b><div class="small">Ainda não entrou no app 💌</div></div></div></div>`;
  const p = S.people[uid] || {}, favs = (p.favMovies||[]).filter(Boolean).slice(0,4);
  return `<button class="pcard" data-profile="${esc(uid)}"><div class="pbanner" style="${bannerStyle(p)}"></div>
    <div class="pbody"><div class="pav">${avatarHTML(uid,56)}</div>
      <div style="padding-top:6px;min-width:0;flex:1"><b>${esc(nameRaw(uid))}${uid===S.me?` <span class="small">(você)</span>`:""}</b>${p.bio?`<div class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.bio)}</div>`:""}</div></div>
    ${favs.length?`<div class="favrow">${favs.map(f=>`<span>${favPoster(f)}</span>`).join("")}</div>`:""}</button>`;
}
function openProfile(uid){
  const p = S.people[uid] || {}, mine = uid===S.me;
  const watched = S.items.filter(i=>i.kind==="watch" && i.status==="done");
  const rated = watched.map(i=>i.reviews&&i.reviews[uid]).filter(r=>r&&r.rating);
  const avg = rated.length ? (rated.reduce((a,r)=>a+r.rating,0)/rated.length).toFixed(1) : "–";
  const recs = S.items.filter(i=>i.kind==="watch" && i.createdBy===uid && i.recFor==="other").length;
  const revs = watched.filter(i=>i.reviews&&i.reviews[uid]&&(i.reviews[uid].text||i.reviews[uid].rating)).sort((a,b)=>(b.reviews[uid].at||0)-(a.reviews[uid].at||0)).slice(0,5);
  const slots = (list, type) => `<div class="favs">${[0,1,2,3].map(i=>{ const f=(list||[])[i];
    return f ? `<button class="slot" data-fav="${type}" data-id="${f.id}">${favPoster(f)}</button>` : `<span class="slot empty"></span>`; }).join("")}</div>`;
  openSheet(`<div class="hero" style="${bannerStyle(p)};background-size:cover;background-position:center"></div>
    <div style="position:relative;z-index:1;margin-top:-60px;display:flex;flex-direction:column;align-items:center;text-align:center">
      <div style="border:3px solid var(--bg2);border-radius:50%">${avatarHTML(uid,92)}</div>

      ${p.bio?`<div class="small" style="max-width:420px">${esc(p.bio)}</div>`:""}
    </div>
    <div class="tiles" style="margin-top:14px">
      <div class="tile"><b>${avg}</b><span>nota média</span></div>
      <div class="tile"><b>${rated.length}</b><span>avaliações</span></div>
      <div class="tile"><b>${recs}</b><span>indicações</span></div>
    </div>
    <div class="sec">🎬 Filmes favoritos</div>${slots(p.favMovies,"movie")}
    <div class="sec">📺 Séries favoritas</div>${slots(p.favSeries,"tv")}
    ${revs.length?`<div class="sec">Últimos comentários</div>${revs.map(i=>{ const r=i.reviews[uid]; return `<button class="tl" data-openitem="${esc(i.id)}">${coverHTML(i)}
      <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">${esc(i.title)} <span style="color:var(--star);font-size:12px">${starStr(r.rating)}</span></div>${r.text?`<div class="small" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(r.text)}</div>`:""}</div></button>`; }).join("")}`:""}
    <div class="btns" style="margin-top:16px">${mine?`<button class="btn p" id="pEdit">✏️ Editar perfil</button>`:""}<button class="btn g" id="pClose">Fechar</button></div>`, root=>{

    root.querySelector("#pEdit") && (root.querySelector("#pEdit").onclick = ()=>openProfileEdit());
    root.querySelectorAll("[data-openitem]").forEach(b=>b.onclick=()=>openDetail(b.dataset.openitem));
    root.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>openTmdbThing(b.dataset.fav, +b.dataset.id));
  });
}

// sobreposição de busca no TMDB (type: movie | tv | multi)
function overlaySheet(html){
  const ov = document.createElement("div"); ov.className = "sheet-bg show"; ov.style.zIndex = 30;
  ov.innerHTML = `<div class="sheet"><button class="sheet-x" aria-label="Fechar">✕</button><div class="grab"></div>${html}</div>`;
  document.body.appendChild(ov); ov.addEventListener("click", e=>{ if(e.target===ov) ov.remove(); });
  ov.querySelector(".sheet-x").onclick = ()=>ov.remove(); swipeToClose(ov.querySelector(".sheet"), ()=>ov.remove());
  return ov;
}
function openTmdbSearch(type, title, onPick){
  if (!TMDB.ok()) return toast("Configure a chave do TMDB");
  const ov = overlaySheet(`<h2>${esc(title)}</h2><div class="field"><input id="osq" placeholder="🔎 Buscar…" autocomplete="off" autocapitalize="off"></div><div class="results" id="osr"></div><div class="btns"><button class="btn g" id="osx">Cancelar</button></div>`);
  const q = ov.querySelector("#osq"), out = ov.querySelector("#osr"); let t, seq=0;
  ov.querySelector("#osx").onclick = ()=>ov.remove(); setTimeout(()=>q.focus(), 250);
  q.oninput = ()=>{ clearTimeout(t); const s=q.value.trim(); if(s.length<2){ out.innerHTML=""; return; }
    t = setTimeout(async ()=>{ const my=++seq; out.innerHTML=`<div class="small">Buscando…</div>`;
      try {
        let rs;
        if (type==="multi"){ const d = await TMDB.get("/search/multi", { query:s, include_adult:"false" }); rs = (d.results||[]).filter(r=>r.media_type==="movie"||r.media_type==="tv").slice(0,8); }
        else rs = await TMDB.search(s, type);
        if (my!==seq) return;
        out.innerHTML = rs.length ? rs.map((r,i)=>`<button type="button" class="res" data-i="${i}">${r.poster_path?`<img src="${IMG}w92${esc(r.poster_path)}" alt="">`:`<span class="noimg"></span>`}
          <span style="min-width:0"><b>${esc(r.title||r.name)}</b><span class="meta">${r.media_type==="tv"?"Série":"Filme"}${(r.release_date||r.first_air_date)?" · "+esc((r.release_date||r.first_air_date).slice(0,4)):""}</span></span></button>`).join("") : `<div class="small">Nada encontrado.</div>`;
        out.querySelectorAll(".res").forEach(b=>b.onclick=()=>{ ov.remove(); onPick(rs[+b.dataset.i]); });
      } catch(_){ if(my===seq) out.innerHTML=`<div class="small">Não consegui buscar agora.</div>`; } }, 300); };
}
function openBackdropPicker(r, onPick){
  const ov = overlaySheet(`<h2>Escolha a cena</h2><div id="bdg" class="small">Carregando…</div><div class="btns"><button class="btn g" id="bdx">Cancelar</button></div>`);
  ov.querySelector("#bdx").onclick = ()=>ov.remove();
  TMDB.details(r.media_type, r.id).then(d=>{
    const bs = ((d.images&&d.images.backdrops)||[]).slice(0,24); if (r.backdrop_path && !bs.find(b=>b.file_path===r.backdrop_path)) bs.unshift({file_path:r.backdrop_path});
    const g = ov.querySelector("#bdg");
    if (!bs.length){ g.textContent = "Sem cenas para este título."; return; }
    g.className = ""; g.style.cssText = "display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:60vh;overflow-y:auto";
    g.innerHTML = bs.map(b=>`<button data-p="${esc(b.file_path)}" style="border-radius:8px;overflow:hidden;aspect-ratio:16/9"><img src="${IMG}w300${esc(b.file_path)}" style="width:100%;height:100%;object-fit:cover" loading="lazy" alt=""></button>`).join("");
    g.querySelectorAll("button").forEach(b=>b.onclick=()=>{ ov.remove(); onPick(b.dataset.p); });
  }).catch(()=>{ ov.querySelector("#bdg").textContent = "Não consegui carregar."; });
}

// abre um título do TMDB: se já está nas listas, mostra o detalhe; senão uma prévia com "adicionar"
async function openTmdbThing(tt, id){
  const it = S.items.find(i=>i.tmdbId===id && i.tmdbType===tt);
  if (it) return openDetail(it.id);
  openSheet(`<div class="small" style="padding:30px;text-align:center">Carregando…</div>`);

const tabOf = it => it.kind==="place" ? "places" : it.mediaType==="serie" ? "series" : "movies";
const isNew = it => S.prevSeen && it.createdBy && it.createdBy!==S.me && (it.createdAt||0) > S.prevSeen;
function agoTxt(ms){ const m=Math.round((Date.now()-ms)/60000); if(m<1) return "agora"; if(m<60) return `${m} min`; const h=Math.round(m/60); if(h<24) return `${h} h`; const d=Math.round(h/24); return d===1?"ontem":`${d} dias`; }
function buildEvents(since){
  const o = other(); if (!o) return [];
  const on = esc(nameRaw(o)), ev = [];
  for (const it of S.items){
    const t = `<b>${esc(it.title)}</b>`, place = it.kind==="place", w = it.mediaType==="serie" ? "a série" : "o filme";
    if (it.createdBy===o && (it.createdAt||0) > since){
      let txt, icon;
      if (it.fromMatch){ icon="🍿"; txt = `Fechado! Você e ${on} toparam ${t} — foi pra lista de vocês`; }
      else if (place){ icon="📍"; txt = it.status==="done" ? `${on} registrou que vocês foram em ${t}` : `${on} quer ir em ${t}`; }
      else if (it.status==="done"){ icon="🎬"; txt = `${on} registrou ${w} ${t} como assistid${it.mediaType==="serie"?"a":"o"}`; }
      else if (forMeFn(it)){ icon="💌"; txt = `${on} te indicou ${w} ${t}`; }
      else if (togetherFn(it)){ icon="💑"; txt = `${on} adicionou ${t} pra vocês verem juntos`; }
      else { icon="🙋"; txt = `${on} quer ver ${t}`; }
      ev.push({ key:"c"+it.id, at:it.createdAt, it, icon, txt, tab:tabOf(it) });
    }
    const r = it.reviews && it.reviews[o];
    const marked = it.doneBy===o && (it.doneMarkedAt||0) > since && !(it.createdBy===o && (it.createdAt||0) > since);
    if (r && (r.at||0) > since && (r.text||r.rating)){
      const stars = r.rating ? ` <span style="color:var(--star)">${starStr(r.rating)}</span>` : "";
      ev.push({ key:"r"+it.id+(r.at||0), at:r.at, it, icon:place?"📍":"⭐", tab:tabOf(it),
        txt: `${on} ${marked ? (place?"foi em":"assistiu") + " " + t + " e avaliou" : "avaliou " + t}${stars}`, quote: r.text });
    } else if (marked){
      ev.push({ key:"d"+it.id, at:it.doneMarkedAt, it, icon:place?"📍":"✅", tab:tabOf(it), txt: `${on} marcou ${t} como ${place?"visitado":"assistido"}` });
    }
    const mine = it.reviews && it.reviews[S.me];
    const ra = mine && mine.reactAt && mine.reactAt[o], re = mine && mine.reactions && mine.reactions[o];
    if (ra > since && re) ev.push({ key:"x"+it.id+ra, at:ra, it, icon:re, tab:tabOf(it), txt: `${on} reagiu ${re} ao seu comentário em ${t}` });
  }
  for (const [tt, m] of Object.entries(S.match)) if (m && m.createdBy===o && (m.createdAt||0) > since)
    ev.push({ key:"m"+tt+m.createdAt, at:m.createdAt, match:tt, icon:"🤝", tab: tt==="tv"?"series":"movies", txt: `${on} começou uma rodada do <b>Topa?</b> de ${tt==="tv"?"séries":"filmes"} — bora votar!` });
  for (const f of S.folders) if (f.createdBy===o && (f.createdAt||0) > since)
    ev.push({ key:"f"+f.id, at:f.createdAt, folder:f.id, icon:f.emoji||"📁", tab:"us", txt: `${on} criou a pasta <b>${esc(f.name)}</b>` });
  for (const g of S.goals) if (g.createdBy===o && (g.createdAt||0) > since)
    ev.push({ key:"g"+g.id, at:g.createdAt, icon:"🎯", tab:"us", txt: `${on} criou a meta <b>${esc(g.text)}</b>` });
  return ev.sort((a,b)=>b.at-a.at);
}

function swipeCard(el, onVote){
  let x0=null, y0=0, dx=0, dragging=false;
  const yes = el.querySelector(".stamp.yes"), no = el.querySelector(".stamp.no");
  el.addEventListener("pointerdown", e=>{ x0=e.clientX; y0=e.clientY; dx=0; dragging=false; el.setPointerCapture && el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove", e=>{ if (x0==null) return; dx = e.clientX-x0; const dy = e.clientY-y0;
    if (!dragging && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) dragging = true;
    if (!dragging) return;
    el.style.transition="none"; el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx/90)); no.style.opacity = Math.max(0, Math.min(1, -dx/90)); });
  const end = ()=>{ if (x0==null) return; x0=null;
    if (dragging && Math.abs(dx) > 90){ const dir = dx>0?1:-1; el.style.transition="transform .2s ease-in, opacity .2s"; el.style.transform=`translateX(${dir*130}%) rotate(${dir*18}deg)`; el.style.opacity="0"; setTimeout(()=>onVote(dir>0?1:0), 180); }
    else { el.style.transition="transform .2s"; el.style.transform=""; yes.style.opacity=0; no.style.opacity=0; } };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}

function openMatchSetup(tt){
  const word = tt==="tv" ? "séries" : "filmes";
  openSheet(`<h2>🤝 Nova rodada do Topa?</h2>
    <p class="small" style="margin:-6px 0 14px">Vou separar 40 ${word} em alta. Cada um vota no seu celular — quando os dois toparem o mesmo, tá fechado e vai pra lista Juntos.</p>
    <div class="field"><label>Gêneros (opcional)</label><div id="msG" class="small">Carregando…</div></div>
    <div class="field"><label>Plataformas (opcional)</label><div id="msP" class="small">Carregando…</div></div>
    <div class="btns"><button class="btn p" id="msGo">Começar rodada</button><button class="btn g" id="msX">Cancelar</button></div>`, async root=>{
    root.querySelector("#msX").onclick = closeSheet;
    if (!TMDB.ok()){ root.querySelector("#msG").textContent = "Configure a chave do TMDB."; return; }
    let gs = [], ps = [];
    try {
      [gs, ps] = await Promise.all([TMDB.genres(tt), TMDB.providers(tt)]);
      root.querySelector("#msG").outerHTML = `<div class="chips" data-multi="mg">${gs.map(g=>`<button type="button" class="chip" data-v="${g.id}">${esc(g.name)}</button>`).join("")}</div>`;
      root.querySelector("#msP").outerHTML = `<div class="chips" data-multi="mp">${ps.map(p=>`<button type="button" class="chip" data-v="${p.id}" style="display:flex;align-items:center;gap:6px;padding-left:6px">${p.logo?`<img src="${IMG}w92${esc(p.logo)}" style="width:20px;height:20px;border-radius:5px" alt="">`:""}${esc(p.name)}</button>`).join("")}</div>`;
      wireMulti(root);
    } catch(_){ root.querySelector("#msG").textContent = "Não consegui carregar agora."; root.querySelector("#msP").textContent = ""; }
    root.querySelector("#msGo").onclick = async e=>{
      const gsel = getMulti(root,"mg"), psel = getMulti(root,"mp");
      e.target.disabled = true; e.target.textContent = "Montando a rodada…";
      try {
        const pages = await Promise.all([1,2,3].map(pg=>TMDB.discover(tt, gsel, psel, pg).catch(()=>({results:[]}))));
        const known = new Set(S.items.filter(i=>i.tmdbId).map(i=>i.tmdbType+i.tmdbId));
        const gname = Object.fromEntries(gs.map(g=>[g.id,g.name]));
        let deck = pages.flatMap(p=>p.results||[]).filter((r,i,a)=>a.findIndex(x=>x.id===r.id)===i && !known.has(tt+r.id) && r.poster_path);
        for (let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
        deck = deck.slice(0,40).map(r=>({ id:r.id, t:r.title||r.name, y:(r.release_date||r.first_air_date||"").slice(0,4), p:r.poster_path||"", v:r.vote_average||0,
          g:(r.genre_ids||[]).map(id=>gname[id]).filter(Boolean).slice(0,3), o:(r.overview||"").slice(0,400) }));
        if (!deck.length){ toast("Nada encontrado com esses filtros"); e.target.disabled=false; e.target.textContent="Começar rodada"; return; }
        const filtersTxt = [gsel.map(id=>gname[id]).join(", "), ps.filter(p=>psel.includes(String(p.id))).map(p=>p.name).join(", ")].filter(Boolean).join(" · ");
        await API.del("match/"+tt).catch(()=>{});
        const data = { deck, votes:{}, filtersTxt, createdBy:S.me, createdAt:Date.now() };
        await API.set("match/"+tt, data);
        S.match[tt] = JSON.parse(JSON.stringify(data));
        toast("Rodada criada 🤝"); openMatch(tt);
      } catch(err){ e.target.disabled=false; e.target.textContent="Começar rodada"; writeErr(err); }
    };
  });
}

    S.me = u.uid; S.email = u.email || "";
    $("#auth").style.display="none"; $("#app").style.display="block"; $("#nav").style.display="flex";
    if (S.pendingName){ API.set("people/"+S.me, { name:S.pendingName, email:S.email }).catch(()=>{}); S.people[S.me]={name:S.pendingName}; S.pendingName=null; }
    setStatus("Carregando…"); render();
    const timer = setTimeout(()=>{ if(!S.loaded) setStatus("Demorando mais que o normal… confira sua internet."); }, 10000);
    const onErr = err => { clearTimeout(timer); console.error(err);
      setStatus(String(err.code||"").includes("permission")
        ? `🔒 Este e-mail (<b>${esc(S.email)}</b>) não está liberado. Confira se ele está escrito igualzinho no arquivo de regras do Firestore. <button id="lo2" style="text-decoration:underline">Sair</button>`
        : "Não consegui carregar os dados agora.");
      $("#lo2") && ($("#lo2").onclick = ()=>API.signOut()); };
    let gotPeople = false;
    unsubs.push(API.watch("people", docs=>{
      S.people = {}; docs.forEach(d=>S.people[d.id]=d); gotPeople = true;
      if (!S.people[S.me] && !$("#sheetBg").classList.contains("show")) openName(true);
      render();
      if (!S.newsReady && S.loaded && S.people[S.me]) setTimeout(startNews, 700); else newsTick();
    }, onErr));
    unsubs.push(API.watch("settings", docs=>{
      S.settings = docs.find(d=>d.id==="couple") || {}; applyTheme();
      if (S.settings.photo) $("#touchIcon").href = S.settings.photo;
      if (!S.splashed) showSplash();
      render();
    }, onErr));
    unsubs.push(API.watch("match", docs=>{ S.match = {}; docs.forEach(d=>S.match[d.id]=d); if (S.matchView) S.matchView(); render(); newsTick(); }, onErr));
    unsubs.push(API.watch("folders", docs=>{ S.folders = docs; render(); newsTick(); }, onErr));
    unsubs.push(API.watch("goals", docs=>{ S.goals = docs.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); render(); }, onErr));
    unsubs.push(API.watch("items", docs=>{
      S.items = docs; S.loaded = true; clearTimeout(timer); setStatus("");
      render();
      if (!S.newsReady && gotPeople) setTimeout(startNews, 700); else newsTick();
    }, onErr));
  });
})();
</script>
</body>
</html>
